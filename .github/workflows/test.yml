name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.22", "5.40", "5.42"]
        backend: [Perl, EV]
        emacs: ["28.2"]
        include:
          - perl: "5.42"
            backend: EV
            emacs: "30.2"
    env:
      PERL_ANYEVENT_MODEL: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpanm
      - name: Install the EV backend
        if: matrix.backend == 'EV'
        run: cpanm --local-lib local EV
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}
      - name: Check code and run all tests
        run: perl test/check.pl
